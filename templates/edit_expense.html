
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Transaction | Expense Tracker</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

    <div class="container py-5">

        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">

                <div class="card shadow-sm border-0">

                    <div class="card-body p-4 p-md-5">

                        <h2 class="text-center mb-2">
                            Edit Transaction
                        </h2>

                        <p class="text-muted text-center mb-4">
                            Update your transaction details
                        </p>

                        <form method="POST">

                            <div class="mb-3">
                                <label class="form-label">Description</label>

                                <input
                                    type="text"
                                    name="description"
                                    class="form-control"
                                    value="{{ expense.description }}"
                                    required
                                >
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Amount (₹)</label>

                                <input
                                    type="number"
                                    name="amount"
                                    class="form-control"
                                    step="0.01"
                                    min="0.01"
                                    value="{{ expense.amount }}"
                                    required
                                >
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Transaction Type</label>

                                <select
                                    name="transaction_type"
                                    id="transaction_type"
                                    class="form-select"
                                    required
                                >
                                    <option value="expense"
                                        {% if expense.transaction_type == "expense" %}selected{% endif %}>
                                        Expense
                                    </option>

                                    <option value="income"
                                        {% if expense.transaction_type == "income" %}selected{% endif %}>
                                        Income
                                    </option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Category</label>

                                <select
                                    name="category"
                                    id="category"
                                    class="form-select"
                                    required
                                >
                                </select>
                            </div>

                            <div class="mb-4">
                                <label class="form-label">Date</label>

                                <input
                                    type="date"
                                    name="date"
                                    class="form-control"
                                    value="{{ expense.date.strftime('%Y-%m-%d') }}"
                                    required
                                >
                            </div>

                            <button
                                type="submit"
                                class="btn btn-primary w-100"
                            >
                                Update Transaction
                            </button>

                        </form>

                        <div class="text-center mt-4">
                            <a
                                href="{{ url_for('dashboard') }}"
                                class="text-decoration-none"
                            >
                                ← Back to Dashboard
                            </a>
                        </div>

                    </div>
                </div>

            </div>
        </div>

    </div>

    <script>
        const transactionType = document.getElementById("transaction_type");
        const categorySelect = document.getElementById("category");

        // Remember the category of the existing transaction.
        const currentCategory = {{ expense.category | tojson }};

        const categories = {
            expense: [
                "Food & Dining",
                "Groceries",
                "Transportation",
                "Fuel",
                "Shopping",
                "Rent",
                "Electricity & Bills",
                "Internet & Mobile",
                "Healthcare",
                "Education",
                "Entertainment",
                "Travel",
                "Personal Care",
                "Subscriptions",
                "Home & Maintenance",
                "Insurance",
                "Other Expenses",
                "Food",
                "Other"
            ],

            income: [
                "Salary",
                "Freelancing",
                "Business Income",
                "Investment Returns",
                "Interest",
                "Rental Income",
                "Gift",
                "Other Income",
                "Other"
            ]
        };

        function updateCategories(selectedCategory = null) {

            const selectedType = transactionType.value;

            categorySelect.innerHTML = "";

            categories[selectedType].forEach(function(category) {

                const option = document.createElement("option");

                option.value = category;
                option.textContent = category;

                if (category === selectedCategory) {
                    option.selected = true;
                }

                categorySelect.appendChild(option);

            });
        }

        // Update categories whenever transaction type changes.
        transactionType.addEventListener("change", function() {
            updateCategories();
        });

        // Load the existing transaction's category when the page opens.
        updateCategories(currentCategory);

    </script>

</body>
</html>
