<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Transaction | Expense Tracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container py-5">

        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">

                <div class="card shadow-sm border-0">

                    <div class="card-body p-4 p-md-5">

                        <h2 class="text-center mb-2">
                            Add Transaction
                        </h2>

                        <p class="text-muted text-center mb-4">
                            Record your income or expenses
                        </p>

                        <form method="POST">

                            <div class="mb-3">
                                <label class="form-label">
                                    Description
                                </label>

                                <input type="text" name="description" class="form-control"
                                    placeholder="e.g. Grocery shopping" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">
                                    Amount (₹)
                                </label>

                                <input type="number" name="amount" class="form-control" placeholder="Enter amount"
                                    step="1" min="1" required>
                            </div>


                            <div class="mb-3">
                                <label class="form-label">Transaction Type</label>

                                <select name="transaction_type" id="transaction_type" class="form-select" required>
                                    <option value="expense">Expense</option>
                                    <option value="income">Income</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Category</label>

                                <select name="category" id="category" class="form-select" required>
                                </select>
                            </div>

                            <script>
                                const transactionType =
                                    document.getElementById("transaction_type");

                                const categorySelect =
                                    document.getElementById("category");

                                const categories = {
                                    expense: [
                                        "Food & Dining",
                                        "Groceries",
                                        "Transportation",
                                        "Fuel",
                                        "Shopping",
                                        "Rent",
                                        "Electricity & Bills",
                                        "Internet & Mobile",
                                        "Healthcare",
                                        "Education",
                                        "Entertainment",
                                        "Travel",
                                        "Personal Care",
                                        "Subscriptions",
                                        "Home & Maintenance",
                                        "Insurance",
                                        "Other Expenses"
                                    ],

                                    income: [
                                        "Salary",
                                        "Freelancing",
                                        "Business Income",
                                        "Investment Returns",
                                        "Interest",
                                        "Rental Income",
                                        "Gift",
                                        "Other Income"
                                    ]
                                };

                                function updateCategories() {
                                    const selectedType = transactionType.value;

                                    categorySelect.innerHTML = "";

                                    categories[selectedType].forEach(function (category) {
                                        const option = document.createElement("option");

                                        option.value = category;
                                        option.textContent = category;

                                        categorySelect.appendChild(option);
                                    });
                                }

                                transactionType.addEventListener(
                                    "change",
                                    updateCategories
                                );

                                updateCategories();
                            </script>


                            <div class="mb-4">
                                <label class="form-label">
                                    Date
                                </label>

                                <input type="date" name="date" class="form-control" required>
                            </div>

                            <button type="submit" class="btn btn-primary w-100">
                                Save Transaction
                            </button>

                        </form>

                        <div class="text-center mt-4">
                            <a href="{{ url_for('dashboard') }}" class="text-decoration-none">
                                ← Back to Dashboard
                            </a>
                        </div>

                    </div>
                </div>

            </div>
        </div>

    </div>

</body>

</html>
